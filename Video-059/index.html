<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faulty Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="hed">Calculater</div>
    <input class="item-0" type="text" id="display" readonly>
    <button class="item-11" onclick="press('+')">+</button>
    <button class="item-12" onclick="press('-')">-</button>
    <button class="item-13" onclick="press('*')">*</button>
    <button class="item-14" onclick="press('/')">/</button>
    <button class="item-14" onclick="press('%')">%</button>
    <button class="item-14" onclick="press('**')">**</button>
    <button class="item-15" onclick="calculate()">=</button>
    <button class="item-1" onclick="press('1')">1</button>
    <button class="item-2" onclick="press('2')">2</button>
    <button class="item-3" onclick="press('3')">3</button>
    <button class="item-4" onclick="press('4')">4</button>
    <button class="item-5" onclick="press('5')">5</button>
    <button class="item-6" onclick="press('6')">6</button>
    <button class="item-7" onclick="press('7')">7</button>
    <button class="item-8" onclick="press('8')">8</button>
    <button class="item-9" onclick="press('9')">9</button>
    <button class="item-10" onclick="press('0')">0</button>
    <button  style="background-color: rgb(108, 96, 96); font-weight: 700;
    " class="clear" onclick="clearDisplay()">C</button>
</div>
    <script src="script.js"></script>
</body>

</html>
