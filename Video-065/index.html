<body>

    <div class="box">
        <h1>Factor Calculator</h1>

        <span>
            <input type="text" id="display" readonly>
        </span>

        <h3>Enter your number and you got factorial of it:</h3>

        <span>
            <input type="number" id="myInput">
        </span>

        <span>
            <button type="button" onclick="clearInput()">Clear</button>
        </span>

        <span>
            <button type="button" onclick="cal()">Calculate</button>
        </span>
    </div>

    <script>
        const input = document.getElementById("myInput");
        const display = document.getElementById("display");

        function cal() {

            const num = Number(input.value);

            if (input.value === "" || num < 0 || !Number.isInteger(num)) {
                display.value = "Error";
                return;
            }

            const factorial = facto(num);

            display.value = factorial;
        }


        // Factorial using for loop
        function facto(num) {

            let factorial = 1;

            for (let i = 1; i <= num; i++) {
                factorial *= i;
            }

            return factorial;
        }


        // Factorial using reduce
        function factoReduce(num) {

            if (num === 0) {
                return 1;
            }

            return Array.from(
                { length: num },
                (_, i) => i + 1
            ).reduce((total, current) => total * current, 1);
        }


        function clearInput() {
            input.value = "";
            display.value = "";
        }
    </script>
