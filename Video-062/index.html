<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title">Business Name Generator</div>

        <p class="sms">We generate business names in three parts</p>

        <div class="info">
            <div class="adjective">
                <p>Adjective</p>
                <p>Crays</p>
                <p>Amazing</p>
                <p>Fire</p>
            </div>
            <div class="shopName">
                <p>Shop Name</p>
                <p>Engine</p>
                <p>Foods</p>
                <p>Garments</p>
            </div>
            <div class="anotherWorld">
                <p>Another World</p>
                <p>Bros</p>
                <p>Limited</p>
                <p>Hub</p>
            </div>
        </div>

        <div class="generate"><button id="generate" onclick="generate()">Generate</button></div>

        <div class="output"><input type="text" id="display" value=""></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
