        var color = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];
        console.log(color)

        function rgb(k) {
            // for (let i = 0; i < color.length; i++) {
            document.querySelector("body").style.backgroundColor = `${color[k]}`;
            // }
        }


        var k = 0
        setInterval(() => {
            if (k < color.length) {
                rgb(k)
                k++;
            }
            else {
                k = 0;
            }
        }, 2000)


    </script>
